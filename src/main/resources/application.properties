# File upload configuration

file.upload-dir=./uploads
spring.web.resources.static-locations=file:./uploads/

server.port=${PORT:5000}
server.servlet.context-path=/awsodclearning

# Datasource MySQL
spring.datasource.url=jdbc:mysql://awseb-e-rafruf9ypt-stack-awsebrdsdatabase-rfrjq9mjmb0m.ck5a2240egow.us-east-1.rds.amazonaws.com/odcawslearning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectTimeout=60000&socketTimeout=60000
